<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sistem Absensi RFID — MI Miftahul Athfal</title>
<style>
:root{--navy:#102f35;--teal:#0f766e;--bg:#f5f7fb;--line:#e2e8f0;--muted:#64748b}
*{box-sizing:border-box}body{margin:0;font:14px/1.5 system-ui,Arial,sans-serif;background:var(--bg);color:#172033}button,input,select{font:inherit}button{cursor:pointer;border:1px solid var(--line);background:white;border-radius:9px;padding:9px 12px;font-weight:600}button.primary{background:var(--teal);color:white;border-color:var(--teal)}button.danger{color:#b91c1c}.hidden{display:none!important}.login{min-height:100vh;display:grid;place-items:center;padding:20px;background:linear-gradient(130deg,#d1fae5,#f8fafc 55%,#dbeafe)}.loginbox{width:min(900px,100%);display:grid;grid-template-columns:1fr 1fr;background:white;border-radius:22px;overflow:hidden;box-shadow:0 20px 70px #0f172a18}.loginbrand{background:var(--navy);color:white;padding:42px;display:flex;flex-direction:column;justify-content:space-between;min-height:420px}.loginform{padding:42px;align-self:center}.field{width:100%;padding:10px;border:1px solid #cbd5e1;border-radius:9px;background:white}.fieldlabel{display:block;font-size:12px;font-weight:700;margin:14px 0 6px}.shell{display:flex;min-height:100vh}.sidebar{background:var(--navy);color:white;width:235px;padding:18px 13px;flex-shrink:0}.brand{font-weight:800;padding:12px 8px 25px}.nav{display:block;width:100%;text-align:left;color:#d3e3e3;background:transparent;border:0;margin:3px 0}.nav.active,.nav:hover{background:var(--teal);color:white}.main{flex:1;min-width:0}.top{background:white;border-bottom:1px solid var(--line);padding:14px 22px;display:flex;align-items:center;justify-content:space-between;gap:12px}.content{padding:24px;max-width:1500px;margin:auto}.title{font-size:25px;font-weight:800;margin:0}.muted{color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:13px}.grid2{display:grid;grid-template-columns:2fr 1fr;gap:14px;margin:15px 0}.card,.stat{background:white;border:1px solid var(--line);border-radius:14px;padding:17px;margin-bottom:14px}.stat strong{font-size:30px;display:block;margin:8px 0}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;white-space:nowrap;font-size:12px}th,td{text-align:left;padding:11px;border-bottom:1px solid #edf1f5}th{background:#f8fafc;color:#64748b}.pill{border-radius:20px;padding:4px 8px;background:#f1f5f9;font-size:11px;font-weight:700}.Hadir{background:#dcfce7;color:#166534}.Izin,.Sakit{background:#fef3c7;color:#92400e}.Alpha{background:#fee2e2;color:#991b1b}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.row .field{width:auto;flex:1;min-width:160px}.toast{position:fixed;right:18px;top:18px;background:#14532d;color:white;padding:13px 17px;border-radius:10px;z-index:20}.rfid{background:linear-gradient(145deg,#0b242d,#104b50);color:white;text-align:center;border-radius:18px;padding:38px 18px}.clock{font-size:55px;font-weight:800}.tapicon{font-size:48px;padding:20px}.barrow{display:flex;align-items:center;gap:8px;margin:12px 0}.bar{height:10px;background:#0d9488;border-radius:10px}.modal{position:fixed;inset:0;background:#0f172a88;display:grid;place-items:center;padding:15px;z-index:10}.modalbox{background:white;border-radius:16px;padding:22px;width:min(620px,100%);max-height:90vh;overflow:auto}.photo{width:35px;height:35px;border-radius:50%;object-fit:cover;background:#e2e8f0}@media(max-width:850px){.sidebar{width:180px}.grid{grid-template-columns:repeat(2,1fr)}.content{padding:14px}}@media(max-width:600px){.loginbox{grid-template-columns:1fr}.loginbrand{min-height:200px;padding:25px}.loginform{padding:25px}.sidebar{width:65px;padding:10px 5px}.brand{font-size:0;padding:12px 0}.nav{font-size:0;text-align:center;padding:12px 2px}.nav:before{content:"•";font-size:20px}.grid2{grid-template-columns:1fr}.top{padding:12px}.clock{font-size:38px}}@media print{body *{visibility:hidden}.printarea,.printarea *{visibility:visible}.printarea{position:absolute;left:0;top:0;width:100%;padding:20px;background:white}.noprint{display:none!important}}
</style>
</head>
<body>
<div id="login" class="login">
 <div class="loginbox"><div class="loginbrand"><div><div id="loginLogo" style="font-size:36px">🏫</div><p style="color:#86efac">SISTEM INFORMASI SEKOLAH</p><h1>Absensi Digital<br>Berbasis RFID</h1><p>MI Miftahul Athfal | Gondosuli</p></div><small>Presensi guru dan siswa lebih mudah.</small></div>
 <form id="loginForm" class="loginform"><p style="color:var(--teal);font-weight:700">SELAMAT DATANG</p><h2>Masuk ke akun Anda</h2><label class="fieldlabel">Nama pengguna</label><input id="username" class="field" value="admin" required><label class="fieldlabel">Kata sandi</label><input id="password" type="password" class="field" placeholder="Masukkan kata sandi" required><p id="loginError" style="color:#b91c1c" class="hidden">Login tidak sesuai.</p><button class="primary" style="width:100%;margin-top:20px">Masuk ke Dashboard →</button><p class="muted">Demo: <b>admin</b> / <b>admin123</b></p></form></div>
</div>
<div id="shell" class="shell hidden">
 <aside id="sidebar" class="sidebar noprint"><div class="brand"><span id="sideLogo">🏫</span> <span id="sideName">MI Miftahul Athfal<br>Gondosuli</span></div>
 <button class="nav active" data-page="dashboard">▦　Dashboard</button><button class="nav" data-page="guru">♙　Data Guru</button><button class="nav" data-page="siswa">♧　Data Siswa</button><button class="nav" data-page="rfid">▤　Absensi RFID</button><button class="nav" data-page="manual">☷　Absensi Manual</button><button class="nav" data-page="rekap">▤　Rekapan & Laporan</button><button class="nav" data-page="pengaturan">⚙　Pengaturan Sekolah</button><button class="nav" id="logout">↪　Keluar</button></aside>
 <main class="main"><header class="top noprint"><div><b id="pageTitle">Dashboard</b><div id="pageSub" class="muted">Ringkasan kehadiran sekolah</div></div><div class="row"><span id="today"></span><button id="fullscreen">⛶ Fullscreen</button></div></header><div id="content" class="content"></div><div id="printarea" class="printarea hidden"></div></main>
</div>
<div id="modal" class="modal hidden"><div class="modalbox"><div class="row" style="justify-content:space-between"><h2 id="modalTitle">Form</h2><button id="closeModal">✕</button></div><div id="modalBody"></div></div></div><div id="toast" class="toast hidden"></div>
<script>
(()=>{
const $=id=>document.getElementById(id),today=()=>new Date().toLocaleDateString('en-CA'),uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),datefmt=s=>s?new Date(s+'T12:00:00').toLocaleDateString('id-ID',{day:'2-digit',month:'short',year:'numeric'}):'-';
let db={people:{guru:[],siswa:[]},logs:[],settings:{school:'MI Miftahul Athfal | Gondosuli',logo:''}},page='dashboard',filter={from:'',to:'',type:'Semua',status:'Semua'},manualType='siswa',search='',clockTimer;
try{db={...db,...JSON.parse(localStorage.getItem('miRFID_source')||'{}')};db.people=db.people||{guru:[],siswa:[]};db.logs=db.logs||[];db.settings={school:'MI Miftahul Athfal | Gondosuli',logo:'',...db.settings}}catch(e){}
let backendReady=false;
function save(){
  try{localStorage.setItem('miRFID_source',JSON.stringify(db))}catch(e){alert('Penyimpanan browser penuh. Kurangi ukuran foto.')}
  if(backendReady){
    fetch('/api/state',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({state:db})})
      .then(r=>{if(!r.ok)throw new Error('Gagal menyimpan ke database')})
      .catch(()=>msg('Perhatian: data belum tersinkron ke database server.'));
  }
}
const backendLoad=fetch('/api/state')
  .then(r=>{if(!r.ok)throw new Error('Backend tidak merespons');return r.json()})
  .then(async data=>{
    if(data.state){
      db={...db,...data.state};
      db.people=db.people||{guru:[],siswa:[]};db.logs=db.logs||[];
      db.settings={school:'MI Miftahul Athfal | Gondosuli',logo:'',...(db.settings||{})};
      try{localStorage.setItem('miRFID_source',JSON.stringify(db))}catch(e){}
    }else{
      await fetch('/api/state',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({state:db})});
    }
    backendReady=true;
  })
  .catch(err=>{console.error(err);backendReady=false;});

function msg(s){$('toast').textContent='✓ '+s;$('toast').classList.remove('hidden');setTimeout(()=>$('toast').classList.add('hidden'),3000)}
function all(){return [...db.people.guru.map(p=>({...p,type:'guru'})),...db.people.siswa.map(p=>({...p,type:'siswa'}))]}
function log(id,date=today()){return db.logs.find(x=>x.id===id&&x.date===date)}
function record(p,status='Hadir',source='Manual'){let l=log(p.id);if(l)Object.assign(l,{status,source,time:new Date().toLocaleTimeString('id-ID'),name:p.name,type:p.type,phone:p.phone||'',nis:p.nis||'',rfid:p.rfid||''});else db.logs.push({id:p.id,name:p.name,type:p.type,date:today(),time:new Date().toLocaleTimeString('id-ID'),status,source,phone:p.phone||'',nis:p.nis||'',rfid:p.rfid||''});save()}
function counts(type){let ps=db.people[type],ls=ps.map(p=>log(p.id));return {total:ps.length,h:ls.filter(x=>x&&x.status==='Hadir').length,i:ls.filter(x=>x&&['Izin','Sakit'].includes(x.status)).length,a:ls.filter(x=>x&&x.status==='Alpha').length,b:ps.filter((p,i)=>!ls[i]).length}}
function show(pageName){page=pageName;document.querySelectorAll('.nav[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===page));$('sidebar').classList.toggle('hidden',page==='rfid');$('pageTitle').textContent=({dashboard:'Dashboard',guru:'Data Guru',siswa:'Data Siswa',rfid:'Absensi RFID',manual:'Absensi Manual',rekap:'Rekapan & Laporan',pengaturan:'Pengaturan Sekolah'})[page];$('pageSub').textContent=({dashboard:'Ringkasan kehadiran sekolah',guru:'Kelola informasi tenaga pendidik',siswa:'Kelola data siswa dan kartu RFID',rfid:'Tempelkan kartu untuk presensi otomatis',manual:'Perbarui kehadiran harian',rekap:'Cetak dan unduh laporan',pengaturan:'Profil dan identitas sekolah'})[page];render()}
function render(){ $('today').textContent=new Date().toLocaleDateString('id-ID',{weekday:'short',day:'numeric',month:'short',year:'numeric'});$('sideName').textContent=db.settings.school;$('sideLogo').innerHTML=db.settings.logo?`<img src="${db.settings.logo}" style="width:30px;height:30px;object-fit:contain">`:'🏫';$('loginLogo').innerHTML=$('sideLogo').innerHTML;
if(page==='dashboard')dashboard();if(page==='guru'||page==='siswa')peoplePage();if(page==='rfid')rfidPage();if(page==='manual')manualPage();if(page==='rekap')rekapPage();if(page==='pengaturan')settingsPage()}
function dashboard(){let g=counts('guru'),s=counts('siswa'),ex=db.logs.filter(l=>l.date===today()&&['Izin','Sakit'].includes(l.status));let days=[];for(let i=6;i>=0;i--){let d=new Date();d.setDate(d.getDate()-i);let key=d.toLocaleDateString('en-CA');days.push({key,label:d.toLocaleDateString('id-ID',{weekday:'short'}),n:db.logs.filter(l=>l.date===key&&l.status==='Hadir').length})}let max=Math.max(1,...days.map(d=>d.n));$('content').innerHTML=`<div class="row" style="justify-content:space-between;margin-bottom:20px"><div><h1 class="title">Dashboard</h1><p class="muted">Selamat datang di panel absensi sekolah.</p></div><button class="primary" data-go="rfid">▤ Buka Absensi RFID</button></div><div class="grid"><div class="stat">TOTAL GURU<strong>${g.total}</strong><span class="muted">Hadir: ${g.h} (${g.total?Math.round(g.h/g.total*100):0}%)</span><div class="barrow"><div class="bar" style="width:${g.total?g.h/g.total*100:0}%"></div></div></div><div class="stat">TOTAL SISWA<strong>${s.total}</strong><span class="muted">Hadir: ${s.h} (${s.total?Math.round(s.h/s.total*100):0}%)</span><div class="barrow"><div class="bar" style="width:${s.total?s.h/s.total*100:0}%"></div></div></div><div class="stat">HADIR HARI INI<strong>${s.h+g.h}</strong><span class="muted">${s.h} siswa · ${g.h} guru</span></div><div class="stat">IZIN / SAKIT<strong>${s.i+g.i}</strong><span class="muted">Alpha: ${s.a+g.a} orang</span></div></div><div class="grid2"><div class="card"><h3>Tren Kehadiran Mingguan</h3><p class="muted">Jumlah guru dan siswa hadir per hari</p><div style="height:180px;display:flex;align-items:end;gap:12px;padding-top:10px">${days.map(d=>`<div style="flex:1;text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:end;height:100%;gap:6px"><b>${d.n}</b><div style="background:#14b8a6;border-radius:5px 5px 0 0;width:min(30px,90%);height:${Math.max(3,d.n/max*120)}px"></div><small>${d.label}</small></div>`).join('')}</div><small class="muted">Grafik berdasarkan data yang tersimpan di browser ini.</small></div><div class="card"><h3>Keterangan Kehadiran</h3>${[['Hadir',g.h+s.h,'#16a34a'],['Izin/Sakit',g.i+s.i,'#d97706'],['Alpha',g.a+s.a,'#dc2626'],['Belum absen',g.b+s.b,'#94a3b8']].map(x=>`<p style="display:flex;justify-content:space-between"><span>${x[0]}</span><b style="color:${x[2]}">${x[1]}</b></p>`).join('')}</div></div><div class="card"><h3>Daftar Izin / Sakit Hari Ini</h3><div class="tablewrap"><table><thead><tr><th>Nama</th><th>Kategori</th><th>Waktu</th><th>Status</th></tr></thead><tbody>${ex.length?ex.map(l=>`<tr><td>${esc(l.name)}</td><td>${l.type==='guru'?'Guru':'Siswa'}</td><td>${esc(l.time)}</td><td><span class="pill ${l.status}">${l.status}</span></td></tr>`).join(''):'<tr><td colspan="4">Belum ada data izin atau sakit hari ini.</td></tr>'}</tbody></table></div></div>`}
function peoplePage(){let type=page,ps=db.people[type],list=ps.filter(p=>(p.name+' '+(p.nis||'')+' '+(p.rfid||'')).toLowerCase().includes(search.toLowerCase()));$('content').innerHTML=`<div class="row" style="justify-content:space-between;margin-bottom:20px"><div><h1 class="title">Data ${type==='guru'?'Guru':'Siswa'}</h1><p class="muted">${ps.length} data terdaftar</p></div><div class="row"><button data-act="import">↑ Import CSV</button><button data-act="export">↓ Ekspor CSV</button><button class="primary" data-act="add">＋ Tambah ${type==='guru'?'Guru':'Siswa'}</button></div></div><div class="card"><div class="row" style="margin-bottom:15px"><input id="searchPeople" class="field" placeholder="Cari nama, NIS, kode RFID..." value="${esc(search)}"></div><div class="tablewrap"><table><thead><tr><th>No.</th>${type==='siswa'?'<th>NIS</th>':''}<th>Foto</th><th>Nama</th><th>${type==='guru'?'Jabatan':'Kelas'}</th><th>Kode RFID</th><th>Jenis Kelamin</th><th>Nomor HP</th><th>Aksi</th></tr></thead><tbody>${list.length?list.map((p,i)=>`<tr><td>${i+1}</td>${type==='siswa'?`<td>${esc(p.nis||'-')}</td>`:''}<td>${p.photo?`<img class="photo" src="${p.photo}">`:'👤'}</td><td><b>${esc(p.name)}</b></td><td>${esc(p.role||'-')}</td><td>${esc(p.rfid||'-')}</td><td>${esc(p.gender||'-')}</td><td>${esc(p.phone||'-')}</td><td><button data-act="edit" data-id="${p.id}">Edit</button> <button class="danger" data-act="delete" data-id="${p.id}">Hapus</button></td></tr>`).join(''):'<tr><td colspan="9">Belum ada data. Klik Tambah untuk memulai.</td></tr>'}</tbody></table></div><p class="muted">Foto maksimal 2 MB. Import menggunakan file CSV UTF-8 yang diekspor dari Excel.</p></div>`;$('searchPeople').oninput=e=>{search=e.target.value;let pos=e.target.selectionStart;peoplePage();$('searchPeople').focus();$('searchPeople').setSelectionRange(pos,pos)}}
function openModal(title,body){$('modalTitle').textContent=title;$('modalBody').innerHTML=body;$('modal').classList.remove('hidden')}
function closeModal(){$('modal').classList.add('hidden')}
function personForm(type,id){let p=id?db.people[type].find(x=>x.id===id):{name:'',nis:'',role:'',rfid:'',gender:'Laki-laki',phone:'',photo:''};let photo=p.photo||'';openModal((id?'Edit':'Tambah')+' Data '+(type==='guru'?'Guru':'Siswa'),`<form id="personForm">${type==='siswa'?`<label class="fieldlabel">NIS *</label><input name="nis" class="field" required value="${esc(p.nis)}">`:''}<label class="fieldlabel">Nama lengkap *</label><input name="name" class="field" required value="${esc(p.name)}"><label class="fieldlabel">${type==='guru'?'Jabatan':'Kelas / Rombel'}</label><input name="role" class="field" value="${esc(p.role)}"><label class="fieldlabel">Kode RFID</label><input name="rfid" class="field" value="${esc(p.rfid)}"><label class="fieldlabel">Jenis kelamin</label><select name="gender" class="field"><option ${p.gender==='Laki-laki'?'selected':''}>Laki-laki</option><option ${p.gender==='Perempuan'?'selected':''}>Perempuan</option></select><label class="fieldlabel">Nomor HP / WhatsApp</label><input name="phone" class="field" value="${esc(p.phone)}"><label class="fieldlabel">Foto dari perangkat</label><input id="photoFile" type="file" class="field" accept="image/*" capture="environment"><div id="preview" style="margin:8px 0">${photo?`<img src="${photo}" class="photo" style="width:65px;height:65px">`:''}</div><div class="row" style="justify-content:flex-end;margin-top:20px"><button type="button" id="cancel">Batal</button><button class="primary">Simpan Data</button></div></form>`);$('cancel').onclick=closeModal;$('photoFile').onchange=e=>{let f=e.target.files[0];if(!f)return;if(f.size>2*1024*1024){alert('Ukuran foto maksimal 2 MB');return}let r=new FileReader();r.onload=()=>{photo=r.result;$('preview').innerHTML=`<img src="${photo}" class="photo" style="width:65px;height:65px">`};r.readAsDataURL(f)};$('personForm').onsubmit=e=>{e.preventDefault();let o=Object.fromEntries(new FormData(e.target));if(o.rfid&&all().some(x=>x.rfid===o.rfid&&x.id!==id)){alert('Kode RFID sudah digunakan');return}if(type==='siswa'&&db.people.siswa.some(x=>x.nis===o.nis&&x.id!==id)){alert('NIS sudah terdaftar');return}o.id=id||uid();o.photo=photo;let i=db.people[type].findIndex(x=>x.id===o.id);if(i<0)db.people[type].push(o);else db.people[type][i]=o;save();closeModal();render();msg('Data berhasil disimpan!')}}
function download(name,rows){let csv=rows.map(r=>r.map(x=>'"'+String(x??'').replace(/"/g,'""')+'"').join(',')).join('\r\n'),a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\uFEFF'+csv],{type:'text/csv;charset=utf-8'}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);msg('File berhasil dibuat.')}
function importPeople(){openModal('Import Data '+(page==='guru'?'Guru':'Siswa'),'<p>File CSV UTF-8 dari Excel. Kolom: '+(page==='siswa'?'nis,nama,kelas,rfid,jenis_kelamin,nomor_hp':'nama,jabatan,rfid,jenis_kelamin,nomor_hp')+'</p><input id="csvfile" class="field" type="file" accept=".csv,text/csv"><div class="row" style="justify-content:flex-end;margin-top:18px"><button id="cancel">Batal</button><button id="doImport" class="primary">Import</button></div>');$('cancel').onclick=closeModal;$('doImport').onclick=()=>{let f=$('csvfile').files[0];if(!f)return alert('Pilih file CSV');let r=new FileReader();r.onload=()=>{let lines=r.result.replace(/^\uFEFF/,'').split(/\r?\n/).filter(Boolean),parse=s=>s.split(',').map(x=>x.trim().replace(/^"|"$/g,'')),h=parse(lines.shift()).map(x=>x.toLowerCase().replace(/[\s_-]/g,'')),col=a=>h.findIndex(x=>a.includes(x)),nc=col(['nama','name']);if(nc<0)return alert('Kolom nama tidak ditemukan');let n=0;lines.forEach(line=>{let a=parse(line);if(!a[nc])return;let o={id:uid(),name:a[nc],nis:a[col(['nis'])]||'',role:a[col(['jabatan','kelas','rombel'])]||'',rfid:a[col(['rfid','koderfid'])]||'',gender:a[col(['jeniskelamin','gender'])]||'Laki-laki',phone:a[col(['nomorhp','hp','telepon'])]||'',photo:''};if((page==='siswa'&&o.nis&&db.people.siswa.some(p=>p.nis===o.nis))||(o.rfid&&all().some(p=>p.rfid===o.rfid)))return;db.people[page].push(o);n++});save();closeModal();render();msg(n+' data berhasil diimpor')};r.readAsText(f,'UTF-8')}}
function statusOptions(p){return ['Hadir','Izin','Sakit','Alpha'].map(s=>`<button data-act="status" data-id="${p.id}" data-status="${s}">${s}</button>`).join(' ')}
function manualPage(){let ps=db.people[manualType];$('content').innerHTML=`<h1 class="title">Absensi Manual</h1><p class="muted">Perubahan status tersimpan otomatis.</p><div class="row" style="margin:16px 0"><button class="${manualType==='siswa'?'primary':''}" data-act="mtype" data-type="siswa">Data Siswa</button><button class="${manualType==='guru'?'primary':''}" data-act="mtype" data-type="guru">Data Guru</button><button data-act="alphaall">Tandai yang belum absen sebagai Alpha</button></div><div class="card"><h3>Daftar ${manualType==='siswa'?'Siswa':'Guru'} — ${datefmt(today())}</h3><div class="tablewrap"><table><thead><tr><th>No</th>${manualType==='siswa'?'<th>NIS</th>':''}<th>Nama</th><th>Kelas/Jabatan</th><th>Status</th><th>Ubah Status</th></tr></thead><tbody>${ps.map((p,i)=>{let l=log(p.id);return `<tr><td>${i+1}</td>${manualType==='siswa'?`<td>${esc(p.nis)}</td>`:''}<td>${esc(p.name)}</td><td>${esc(p.role||'-')}</td><td>${l?`<span class="pill ${l.status}">${l.status}</span>`:'Belum absen'}</td><td>${statusOptions({...p,type:manualType})}</td></tr>`}).join('')||'<tr><td colspan="6">Belum ada data. Tambahkan guru/siswa terlebih dahulu.</td></tr>'}</tbody></table></div></div>`}
function rfidPage(){clearInterval(clockTimer);$('content').innerHTML=`<div class="row" style="justify-content:space-between;margin-bottom:14px"><div><h1 class="title">Absensi RFID</h1><p class="muted">Tempelkan kartu untuk mencatat kehadiran otomatis.</p></div><button data-go="dashboard">← Menu Utama</button></div><div class="rfid"><div style="color:#99f6e4">MI MIFTAHUL ATHFAL | GONDOSULI</div><div id="clock" class="clock">00:00:00</div><div id="clockdate"></div><div class="tapicon">▤</div><h2>Tempelkan Kartu RFID</h2><p>Reader USB keyboard akan mengirimkan kode kartu ke kolom ini.</p><div class="row" style="justify-content:center;margin-top:20px"><input id="rfidInput" class="field" style="max-width:300px" placeholder="Menunggu kode kartu..." autocomplete="off"><button class="primary" id="quickTap">⚡ Quick Tap / Simulation Test</button></div></div><div id="tapResult" class="card" style="margin-top:15px;text-align:center">Menunggu kartu RFID...</div><div class="card"><h3>Petunjuk</h3><p>Daftarkan kode RFID pada data guru/siswa. Tempelkan kartu atau masukkan kode dan tekan Enter. Quick Tap menggunakan kartu pertama yang terdaftar.</p><p class="muted">Bunyi beep dan suara menggunakan kemampuan browser. Pesan WhatsApp/SMS memerlukan integrasi layanan eksternal.</p></div>`;function tick(){if($('clock')){$('clock').textContent=new Date().toLocaleTimeString('id-ID');$('clockdate').textContent=new Date().toLocaleDateString('id-ID',{weekday:'long',day:'numeric',month:'long',year:'numeric'})}}tick();clockTimer=setInterval(tick,1000);$('rfidInput').focus();$('rfidInput').onkeydown=e=>{if(e.key==='Enter')tap($('rfidInput').value)};$('quickTap').onclick=()=>{let v=$('rfidInput').value.trim()||all().find(p=>p.rfid)?.rfid;if(v)tap(v);else msg('Tambahkan data dengan kode RFID terlebih dahulu')}}
function tap(code){let p=all().find(p=>p.rfid&&p.rfid.toLowerCase()===code.trim().toLowerCase());if(!p){$('tapResult').innerHTML='<b style="color:#b91c1c">Kartu belum terdaftar.</b>';msg('Kode RFID tidak ditemukan');return}record(p,'Hadir','RFID');try{let C=AudioContext||webkitAudioContext,c=new C(),o=c.createOscillator();o.connect(c.destination);o.frequency.value=880;o.start();o.stop(c.currentTime+.15);if('speechSynthesis'in window){let u=new SpeechSynthesisUtterance('Absensi berhasil! Terima kasih.');u.lang='id-ID';speechSynthesis.speak(u)}}catch(e){}$('tapResult').innerHTML=`<h2 style="color:#166534">✓ Absensi berhasil!</h2><p>Terima kasih, <b>${esc(p.name)}</b>.</p><p>${p.type==='guru'?'Guru':'Siswa'} · ${new Date().toLocaleTimeString('id-ID')} · Hadir</p><p>Data tersimpan pada perangkat ini.</p>`;$('rfidInput').value='';$('rfidInput').focus()}
function rekapPage(){let f=filter,logs=db.logs.filter(l=>(!f.from||l.date>=f.from)&&(!f.to||l.date<=f.to)&&(f.type==='Semua'||l.type===f.type)&&(f.status==='Semua'||l.status===f.status)).sort((a,b)=>b.date.localeCompare(a.date));$('content').innerHTML=`<h1 class="title">Rekapan & Laporan</h1><p class="muted">Filter, cetak, dan unduh rekap CSV yang dapat dibuka di Excel.</p><div class="card"><div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(150px,1fr))"><div><label class="fieldlabel">Tanggal mulai</label><input id="from" type="date" class="field" value="${f.from}"></div><div><label class="fieldlabel">Tanggal akhir</label><input id="to" type="date" class="field" value="${f.to}"></div><div><label class="fieldlabel">Kategori</label><select id="rtype" class="field"><option>Semua</option><option value="siswa" ${f.type==='siswa'?'selected':''}>Siswa</option><option value="guru" ${f.type==='guru'?'selected':''}>Guru</option></select></div><div><label class="fieldlabel">Status</label><select id="rstatus" class="field">${['Semua','Hadir','Izin','Sakit','Alpha'].map(s=>`<option ${f.status===s?'selected':''}>${s}</option>`).join('')}</select></div></div><div class="row" style="margin-top:15px"><button class="primary" id="apply">Terapkan Filter</button><button id="reset">Reset</button><button id="csv">↓ Unduh CSV / Excel</button><button id="printAll">Cetak Rekapan</button></div></div><div class="card"><h3>Cetak Per Siswa / Guru</h3><div class="row"><select id="personSelect" class="field"><option value="">Pilih siswa atau guru...</option>${all().map(p=>`<option value="${p.id}">${p.type==='guru'?'Guru':'Siswa'} — ${esc(p.name)}</option>`).join('')}</select><button class="primary" id="printPerson">Cetak Terpilih</button></div></div><div class="card"><h3>Rincian Kehadiran (${logs.length})</h3><div class="tablewrap"><table><thead><tr><th>No</th><th>Tanggal</th><th>Nama</th><th>Kategori</th><th>Waktu</th><th>Status</th><th>Metode</th><th>Aksi</th></tr></thead><tbody>${logs.map((l,i)=>`<tr><td>${i+1}</td><td>${datefmt(l.date)}</td><td>${esc(l.name)}</td><td>${l.type==='guru'?'Guru':'Siswa'}</td><td>${esc(l.time)}</td><td><span class="pill ${l.status}">${l.status}</span></td><td>${esc(l.source)}</td><td><button data-act="printone" data-id="${l.id}">Cetak</button></td></tr>`).join('')||'<tr><td colspan="8">Belum ada catatan dalam periode ini.</td></tr>'}</tbody></table></div></div>`;$('apply').onclick=()=>{filter={from:$('from').value,to:$('to').value,type:$('rtype').value,status:$('rstatus').value};rekapPage()};$('reset').onclick=()=>{filter={from:'',to:'',type:'Semua',status:'Semua'};rekapPage()};$('csv').onclick=()=>download('rekapan_absensi.csv',[['Tanggal','Waktu','Nama','Kategori','NIS','RFID','Status','Metode','Nomor HP'],...logs.map(l=>[l.date,l.time,l.name,l.type,l.nis,l.rfid,l.status,l.source,l.phone])]);$('printAll').onclick=()=>printReport(null);$('printPerson').onclick=()=>{if(!$('personSelect').value)return alert('Pilih orang terlebih dahulu');printReport($('personSelect').value)}}
function printReport(id){let p=id?all().find(x=>x.id===id):null,logs=db.logs.filter(l=>(!p||l.id===p.id)&&(!filter.from||l.date>=filter.from)&&(!filter.to||l.date<=filter.to)&&(filter.type==='Semua'||l.type===filter.type)&&(filter.status==='Semua'||l.status===filter.status));$('printarea').innerHTML=`<div style="font-family:Arial"><h2 style="text-align:center">${esc(db.settings.school)}</h2><h3 style="text-align:center">LAPORAN ABSENSI</h3><hr><h3>${p?'Laporan: '+esc(p.name):'Rekapan Absensi Keseluruhan'}</h3><p>Periode: ${datefmt(filter.from)||'Semua'} – ${datefmt(filter.to)||'Semua'}</p><p>Catatan: ${logs.length} | Hadir: ${logs.filter(l=>l.status==='Hadir').length} | Izin/Sakit: ${logs.filter(l=>['Izin','Sakit'].includes(l.status)).length} | Alpha: ${logs.filter(l=>l.status==='Alpha').length}</p><table border="1" style="width:100%;border-collapse:collapse"><thead><tr><th>No</th><th>Tanggal</th><th>Waktu</th><th>Nama</th><th>Kategori</th><th>Status</th><th>Metode</th></tr></thead><tbody>${logs.map((l,i)=>`<tr><td>${i+1}</td><td>${datefmt(l.date)}</td><td>${esc(l.time)}</td><td>${esc(l.name)}</td><td>${l.type}</td><td>${l.status}</td><td>${esc(l.source)}</td></tr>`).join('')}</tbody></table><p style="text-align:right;margin-top:50px">Gondosuli, ${datefmt(today())}<br><br><br>Kepala Madrasah</p></div>`;$('printarea').classList.remove('hidden');window.print();setTimeout(()=>$('printarea').classList.add('hidden'),500)}
function settingsPage(){$('content').innerHTML=`<h1 class="title">Pengaturan Sekolah</h1><div class="card" style="max-width:700px"><form id="settingsForm"><label class="fieldlabel">Nama sekolah</label><input class="field" name="school" value="${esc(db.settings.school)}" required><label class="fieldlabel">Logo sekolah</label><input class="field" id="logoFile" type="file" accept="image/*"><p class="muted">PNG/JPG maksimal 2 MB.</p><div class="row" style="margin-top:15px"><button class="primary">Simpan Pengaturan</button><button type="button" id="seed">Isi Data Contoh</button><button type="button" id="backup">Unduh Cadangan</button><button type="button" id="restore">Pulihkan Cadangan</button></div></form><p class="muted" style="margin-top:18px">Versi ini menyimpan data di browser lokal. Integrasi WhatsApp/SMS dan penggunaan multi-komputer memerlukan backend/server.</p></div>`;let logo=db.settings.logo;$('logoFile').onchange=e=>{let f=e.target.files[0];if(!f)return;if(f.size>2*1024*1024)return alert('Logo maksimal 2 MB');let r=new FileReader();r.onload=()=>logo=r.result;r.readAsDataURL(f)};$('settingsForm').onsubmit=e=>{e.preventDefault();db.settings.school=new FormData(e.target).get('school');db.settings.logo=logo;save();render();msg('Pengaturan berhasil disimpan')};$('seed').onclick=()=>{if(all().length)return alert('Data sudah ada');db.people.guru=[{id:uid(),name:'Ahmad Fauzi',role:'Guru Kelas',rfid:'GURU001',gender:'Laki-laki',phone:'',photo:''}];db.people.siswa=[{id:uid(),nis:'2026001',name:'Siti Zahra',role:'IV A',rfid:'SISWA001',gender:'Perempuan',phone:'',photo:''},{id:uid(),nis:'2026002',name:'Ahmad Rizki',role:'IV A',rfid:'SISWA002',gender:'Laki-laki',phone:'',photo:''}];save();render();msg('Data contoh ditambahkan. RFID: SISWA001')};$('backup').onclick=()=>{let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(db,null,2)],{type:'application/json'}));a.download='cadangan-absensi.json';a.click()};$('restore').onclick=()=>{let i=document.createElement('input');i.type='file';i.accept='.json';i.onchange=()=>{let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);if(!x.people||!x.logs)throw 0;db=x;save();render();msg('Cadangan dipulihkan')}catch(e){alert('File cadangan tidak valid')}};r.readAsText(i.files[0])};i.click()}}
$('loginForm').onsubmit=async e=>{e.preventDefault();await backendLoad;if(!backendReady){alert('Backend belum aktif. Jalankan run.bat lalu buka http://127.0.0.1:5000');return}if($('username').value==='admin'&&$('password').value==='admin123'){$('loginError').classList.add('hidden');$('login').classList.add('hidden');$('shell').classList.remove('hidden');show('dashboard')}else $('loginError').classList.remove('hidden')};
$('logout').onclick=()=>{$('shell').classList.add('hidden');$('login').classList.remove('hidden');$('password').value='';clearInterval(clockTimer)};
$('fullscreen').onclick=()=>document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen().catch(()=>alert('Fullscreen tidak didukung browser ini'));
$('closeModal').onclick=closeModal;$('modal').onclick=e=>{if(e.target===$('modal'))closeModal()};
document.addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;if(b.dataset.page)show(b.dataset.page);if(b.dataset.go)show(b.dataset.go);let a=b.dataset.act;if(!a)return;let type=page,id=b.dataset.id;if(a==='add')personForm(type);if(a==='edit')personForm(type,id);if(a==='delete'){if(confirm('Hapus data ini?')){db.people[type]=db.people[type].filter(p=>p.id!==id);save();render();msg('Data dihapus')}}if(a==='import')importPeople();if(a==='export'){let ps=db.people[type];download('data-'+type+'.csv',[type==='siswa'?['NIS','Nama','Kelas','RFID','Jenis Kelamin','Nomor HP']:['Nama','Jabatan','RFID','Jenis Kelamin','Nomor HP'],...ps.map(p=>type==='siswa'?[p.nis,p.name,p.role,p.rfid,p.gender,p.phone]:[p.name,p.role,p.rfid,p.gender,p.phone])])}if(a==='mtype'){manualType=b.dataset.type;manualPage()}if(a==='status'){let p=db.people[manualType].find(p=>p.id===id);if(p){record({...p,type:manualType},b.dataset.status);render();msg('Status absensi berhasil diperbarui')}}if(a==='alphaall'){let n=0;db.people[manualType].forEach(p=>{if(!log(p.id)){record({...p,type:manualType},'Alpha');n++}});render();msg(n+' orang ditandai Alpha')}if(a==='printone')printReport(id)});
})();
</script>
</body>
</html>
